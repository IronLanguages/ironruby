name: CI

on:
  push:
    branches: [master, modernize, 'ci/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  # The prism revision Src/Prism/Generated was generated from (Src/Prism/README.md), the one
  # the vendored Ruby half of prism in Src/StdLib belongs to; release.yml builds from the same
  # one. Move both together with Src/Prism/Generated when following prism.
  PRISM_REF: 30a255539e81842b2b7f12b4fd3c62a7b4d64165
  # The DLR revision Build/dlr-patches applies to; release.yml builds from the same one, so a
  # release can be rebuilt and an upstream change only arrives when this is moved on purpose.
  # Move both together, after checking the patches still apply.
  DLR_REF: 922753f8ccbf5186c15899116d5a407b6b1723fb
  # ruby/spec and mspec for the spec job, pinned so a result moves only with IronRuby's own
  # changes, not with whatever lands upstream on the day.
  SPEC_REF: dda28d049100033a8b7050eacbb35957a2eb0c00
  MSPEC_REF: b79c65ed28b00f0869ad82b0e3dceef0d943cd58

jobs:
  # The repository holds no programs - no .exe, .dll, .so or other binary that runs - so all
  # of it can be read; Util/check-no-executables.rb says why and how it tells them apart.
  no-executables:
    name: no programs in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check every tracked file
        run: ruby Util/check-no-executables.rb

  build-and-test:
    name: ${{ matrix.os }} ${{ matrix.tfm }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        tfm: [net8.0, net10.0]
        include:
          # IronRuby.Tests "> FAILED" line counts. They are the exact current
          # numbers, not head-room: the job fails as soon as one more line
          # appears. 0 since 2026-09-27 (measured on Linux, net8.0 and net10.0):
          # any failure line fails the job.
          - os: ubuntu-latest
            tfm: net8.0
            baseline: 0
          - os: ubuntu-latest
            tfm: net10.0
            baseline: 0
          - os: windows-latest
            tfm: net8.0
            baseline: 0
          - os: windows-latest
            tfm: net10.0
            baseline: 0
    env:
      TFM: ${{ matrix.tfm }}
      IR_TFM: ${{ matrix.tfm }}
      BASELINE: ${{ matrix.baseline }}
    defaults:
      run:
        shell: bash
    steps:
      # The tree stores many sources with CRLF already; the Windows runner's
      # global core.autocrlf=true would rewrite the LF ones on checkout and
      # change the bytes the parser and the tests see.
      - name: Keep checkouts byte-identical on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf input

      - name: Check out IronRuby
        uses: actions/checkout@v7
        with:
          path: ironruby

      # The modern DLR is referenced as source projects from a sibling directory,
      # and prism supplies the parser itself.
      - name: Check out the DLR
        uses: actions/checkout@v7
        with:
          repository: IronLanguages/dlr
          ref: ${{ env.DLR_REF }}
          path: dlr

      # Pinned to the revision Src/Prism/Generated was generated from (Src/Prism/README.md), as
      # release.yml pins it: a libprism from any other revision may serialize differently from
      # what the C# loader and the vendored Prism::Serialize read.
      - name: Check out prism
        uses: actions/checkout@v7
        with:
          repository: ruby/prism
          ref: ${{ env.PRISM_REF }}
          path: prism

      # IronRuby uses DLR APIs that are not upstream yet; the patches that add
      # them live in Build/dlr-patches and go onto the fresh upstream checkout.
      - name: Patch the DLR
        run: |
          for patch in ironruby/Build/dlr-patches/*.patch; do
            echo "applying $patch"
            git -C dlr apply "../$patch"
          done

      # Both runtimes are installed on every matrix entry: the SDK builds either
      # target framework, but running the net8.0 output needs the .NET 8 runtime.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.os }}-${{ hashFiles('ironruby/**/*.csproj', 'ironruby/Directory.Build.props', 'dlr/**/*.csproj') }}
          restore-keys: nuget-${{ matrix.os }}-

      - name: Identify the prism checkout
        id: prism
        run: echo "sha=$(git -C prism rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the prism build
        id: prism-cache
        uses: actions/cache@v6
        with:
          path: prism/build
          key: prism-${{ matrix.os }}-${{ steps.prism.outputs.sha }}

      # On Linux prism's own Makefile does it. prism's own CI never runs
      # `make shared` on Windows - it builds the extension through mkmf - and the
      # Makefile is written for a Unix toolchain (SOEXT out of RbConfig, -Werror
      # together with -fPIC, which MinGW has nothing to do with), so rather than
      # bend it, link the same sources directly with the MSYS2 gcc that
      # ruby/setup-ruby puts on PATH. -DPRISM_EXPORT_SYMBOLS is what the
      # Makefile's shared objects are compiled with too: it turns prism's
      # PRISM_EXPORTED_FUNCTION into __declspec(dllexport) on _WIN32, which is
      # what makes the P/Invokes in Src/Prism/PrismNative.cs resolvable.
      - name: Build libprism
        if: steps.prism-cache.outputs.cache-hit != 'true'
        working-directory: prism
        run: |
          ruby templates/template.rb
          if [ "$RUNNER_OS" = Windows ]; then
            command -v gcc >/dev/null || export PATH="/c/msys64/ucrt64/bin:/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
            gcc --version
            mkdir -p build
            shopt -s nullglob          # prism has no src subdirectories today
            sources=(src/*.c src/*/*.c)
            gcc -shared -O2 -std=c99 -DPRISM_EXPORT_SYMBOLS -Iinclude \
              -o build/libprism.dll "${sources[@]}"
          else
            make shared
          fi
          ls -l build

      # cmark-gfm for markly (Src/Libraries/Markly), compiled from the markly gem's own
      # sources, pinned by SHA-256. On Windows the MSYS2 gcc that links libprism
      # links it too.
      - name: Build libmarkly_cmark
        working-directory: ironruby
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            command -v gcc >/dev/null || export PATH="/c/msys64/ucrt64/bin:/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
          fi
          bash Util/build-markly.sh
          ls -l Src/Libraries/Markly/native/build

      # librbs: the rbs gem's parser behind rbs_extension (Src/Libraries/Rbs). The
      # script downloads the gem pinned by SHA-256, checks the committed bridge
      # against its config.yml, and compiles src/ with the shim - with the MSYS2
      # gcc on Windows, as libprism is, which yields librbs.dll.
      - name: Build librbs
        working-directory: ironruby
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            command -v gcc >/dev/null || export PATH="/c/msys64/ucrt64/bin:/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
          fi
          Util/build-librbs.sh
          ls -l Src/Libraries/Rbs/native/build

      - name: Generate the C# prism loader
        working-directory: ironruby/Src/Prism
        run: ruby generate.rb

      - name: Build
        working-directory: ironruby
        run: dotnet build Src/Console/Ruby.Console.csproj -p:IronRubyTargetFrameworks=$TFM

      - name: Smoke test
        working-directory: ironruby
        run: |
          cat > smoke.rb <<'RUBY'
          puts "#{RUBY_ENGINE} #{RUBY_VERSION} on #{RUBY_PLATFORM}"

          case {name: "prism", version: 1}
          in {name: String => name, version: Integer => v}
            puts "pattern matching: #{name} v#{v}"
          end

          def greet(name:, greeting: "Hello") = "#{greeting}, #{name}!"
          puts greet(name: "world")

          puts [1, 2, 3].filter_map { it * 10 if it.odd? }.inspect
          puts (nil&.length).inspect
          puts (2**100).to_s.length

          # Bundled gems, from Src/StdLib/ruby/gems - the runner's Ruby 3.3 offers none.
          require "rexml/document"
          require "csv"
          require "rake"
          puts "rexml #{REXML::VERSION}, csv #{CSV::VERSION}, rake #{Rake::VERSION}"

          # markly's extension: C# over the native cmark-gfm built above.
          require "markly/markly"
          parser = Markly::Parser.new(0)
          parser.enable(:strikethrough)
          html = parser.parse("*md* ~~x~~")._render_html(0, [:strikethrough]).strip
          puts "markly: #{html}"
          raise "markly rendered #{html.inspect}" unless html == "<p><em>md</em> <del>x</del></p>"
          RUBY
          # ironruby is the launcher, as jruby is JRuby's; RbConfig.ruby has to be a file,
          # since libraries spawn it, and ir is the short name, which has to keep working.
          cat > names.rb <<'RUBY'
          abort "ruby_install_name: #{RbConfig::CONFIG["ruby_install_name"]}" unless RbConfig::CONFIG["ruby_install_name"] == "ironruby"
          abort "no #{RbConfig.ruby}" unless File.file?(RbConfig.ruby)
          puts "#{RbConfig.ruby} exists"
          RUBY
          # ironrubyw.exe, as rubyw.exe: the same interpreter as a Windows GUI program (PE
          # subsystem 2), so it gets no console window. It still writes to a pipe it is given.
          # (A heredoc's end has to start its line, so this one is not inside the if.)
          cat > subsystem.rb <<'RUBY'
          data = File.binread(ARGV[0], 4096)
          subsystem = data[data[0x3c, 4].unpack1("V") + 24 + 68, 2].unpack1("v")
          abort "#{ARGV[0]}: subsystem #{subsystem}" unless subsystem == 2
          RUBY
          if [ "$RUNNER_OS" = Windows ]; then
            cmd //c ironruby.cmd smoke.rb
            cmd //c ironruby.cmd names.rb
            cmd //c ir.cmd -e "puts RUBY_ENGINE"
            # irb loads reline, which on Windows looks up Win32 functions through Fiddle by
            # their names without the A suffix; 4.0.2 died there, at a pipe as at a console.
            printf 'puts 6 * 7\n' | cmd //c iirb.cmd | grep -x 42
            cmd //c ironruby.cmd Util/windows-desktop-check.rb
            rubyw="Src/Console/bin/Debug/$TFM/ironrubyw.exe"
            ruby subsystem.rb "$rubyw"
            "$rubyw" -e 'require "set"; puts "ironrubyw: #{RUBY_ENGINE}"' | grep -x "ironrubyw: ironruby"
          else
            ./ironruby smoke.rb
            ./ironruby names.rb
            ./ir.sh -e 'puts RUBY_ENGINE'
            printf 'puts 6 * 7\n' | ./iirb.sh | grep -x 42
          fi

      # IO#write_nonblock on a socket claims only what the kernel took (#14). On Linux the
      # send buffer fills part-way through a write, which is where the bug lost bytes;
      # Winsock takes a non-blocking send whole or refuses it, so Windows checks that the
      # claimed bytes still all arrive.
      - name: Socket write_nonblock
        timeout-minutes: 2
        working-directory: ironruby
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cmd //c ir.cmd Util/socket-write-nonblock-check.rb
          else
            ./ir.sh Util/socket-write-nonblock-check.rb
          fi

      # Src/Samples/Linq/101samples.rb, the port of Microsoft's 101 LINQ Samples, has to print
      # exactly what 101samples.expected beside it says. Nothing ran it before, and it stopped
      # parsing without anyone noticing. Its stderr counts too, so a warning fails the step.
      # A change to the samples on purpose regenerates the file with
      # `./ir.sh Src/Samples/Linq/101samples.rb > Src/Samples/Linq/101samples.expected 2>&1`.
      - name: LINQ samples
        timeout-minutes: 2
        working-directory: ironruby
        run: |
          status=0
          if [ "$RUNNER_OS" = Windows ]; then
            cmd //c ir.cmd Src/Samples/Linq/101samples.rb > linq.txt 2>&1 || status=$?
          else
            ./ir.sh Src/Samples/Linq/101samples.rb > linq.txt 2>&1 || status=$?
          fi
          tr -d '\r' < linq.txt | diff -u Src/Samples/Linq/101samples.expected -
          exit $status

      # Samples/Notepad, a Windows Forms application, driven by its own test with nobody
      # at the keyboard. A dialog that never closes would wait forever, hence the limit.
      - name: Notepad sample
        if: runner.os == 'Windows'
        timeout-minutes: 5
        working-directory: ironruby
        run: NOTEPAD_SCREENSHOTS="$RUNNER_TEMP/notepad" cmd //c ir.cmd Samples/Notepad/test_notepad.rb

      # What each window looked like, to look at a failure without a Windows machine.
      - name: Keep the Notepad screenshots
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: notepad-screenshots-${{ matrix.tfm }}
          path: ${{ runner.temp }}/notepad
          if-no-files-found: ignore

      # irubyc --single-file: one executable carrying IronRuby, libprism and the stdlib.
      # Run from an empty directory, so it can only work if everything really is inside it.
      - name: irubyc single file
        working-directory: ironruby
        run: |
          mkdir -p sf-app/lib
          cat > sf-app/app.rb <<'RUBY'
          require "yaml"
          require "json"
          require_relative "lib/greeter"
          def fib(n) = n < 2 ? n : fib(n - 1) + fib(n - 2)
          puts "fib=#{fib(20)} #{Greeter.hello} yaml=#{{"a" => 1}.to_yaml.lines.last.strip} json=#{JSON.generate([1])} eval=#{eval("1 + 2")}"
          RUBY
          printf 'module Greeter\n  def self.hello = "hello"\nend\n' > sf-app/lib/greeter.rb
          if [ "$RUNNER_OS" = Windows ]; then
            cmd //c ir.cmd -S irubyc --single-file -t sf-out sf-app/app.rb sf-app/lib/
            exe=app.exe
          else
            ./ir.sh -S irubyc --single-file -t sf-out sf-app/app.rb sf-app/lib/
            exe=app
          fi
          ls -la sf-out/app
          count=$(ls sf-out/app | wc -l)
          [ "$count" -eq 1 ] || { echo "expected exactly one file, got $count"; exit 1; }
          mkdir -p "$RUNNER_TEMP/sf-alone" "$RUNNER_TEMP/sf-extract"
          cp "sf-out/app/$exe" "$RUNNER_TEMP/sf-alone/"
          cd "$RUNNER_TEMP/sf-alone"
          out=$(DOTNET_BUNDLE_EXTRACT_BASE_DIR="$RUNNER_TEMP/sf-extract" "./$exe")
          echo "$out"
          [ "$out" = "fib=6765 hello yaml=a: 1 json=[1] eval=3" ]

      # irubyc --library: one class library that a .NET host loads as a plugin, the way
      # plugin hosts typically do - Assembly.LoadFile, then GetTypes() before
      # any of the plugin's code has run.  Two of them in one host, each alone in an
      # otherwise empty directory, and a host that has already enumerated the encodings
      # (which pins UTF-7 off for the whole process).
      - name: irubyc library
        working-directory: ironruby
        run: |
          IRUBYC="./ir.sh -S irubyc"
          [ "$RUNNER_OS" = Windows ] && IRUBYC="cmd //c ir.cmd -S irubyc"
          for n in 1 2; do
            mkdir -p "lib-app$n/lib"
            cat > "lib-app$n/plugin.rb" <<RUBY
          require "yaml"
          require "json"
          require_relative "lib/helper"
          def fib(n) = n < 2 ? n : fib(n - 1) + fib(n - 2)
          "plugin$n fib=#{fib(20)} yaml=#{{"a" => $n}.to_yaml.lines.last.strip} json=#{JSON.generate([$n])} eval=#{eval("1 + 2")} #{Helper.name}"
          RUBY
            printf 'module Helper\nend\n' > "lib-app$n/lib/helper.rb"
            cat > "lib-app$n/Plugin.cs" <<CS
          using IronRuby.Embedded;
          namespace Plugin$n {
              public class Plugin {
                  private Microsoft.Scripting.Hosting.ScriptEngine _engine;
                  public string Run() {
                      _engine = RubyHost.CreateEngine();
                      return RubyHost.RunMain(_engine, null).ToString();
                  }
              }
          }
          CS
            $IRUBYC --library -o "Plugin$n" -t lib-out --cs "lib-app$n/Plugin.cs" "lib-app$n/plugin.rb" "lib-app$n/lib/"
            count=$(ls "lib-out/Plugin$n" | wc -l)
            [ "$count" -eq 1 ] || { echo "expected exactly one file, got $count"; exit 1; }
            mkdir -p "$RUNNER_TEMP/lib-alone$n"
            cp "lib-out/Plugin$n/Plugin$n.dll" "$RUNNER_TEMP/lib-alone$n/"
          done
          mkdir -p lib-host
          cat > lib-host/LibHost.csproj <<XML
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>$TFM</TargetFramework><OutputType>Exe</OutputType></PropertyGroup>
          </Project>
          XML
          cat > lib-host/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          Console.Error.WriteLine("encodings: " + System.Text.Encoding.GetEncodings().Length);
          foreach (string path in args) {
              Type type = Assembly.LoadFile(Path.GetFullPath(path)).GetTypes().First(t => t.Name == "Plugin");
              object plugin = Activator.CreateInstance(type);
              Console.WriteLine(type.GetMethod("Run").Invoke(plugin, null));
          }
          CS
          dotnet build lib-host/LibHost.csproj -o lib-host/out -v quiet
          out=$(IRUBYC_EXTRACT_BASE_DIR="$RUNNER_TEMP/lib-extract" dotnet lib-host/out/LibHost.dll \
                "$RUNNER_TEMP/lib-alone1/Plugin1.dll" "$RUNNER_TEMP/lib-alone2/Plugin2.dll" | tr -d '\r')
          echo "$out"
          [ "$out" = "$(printf 'plugin1 fib=6765 yaml=a: 1 json=[1] eval=3 Helper\nplugin2 fib=6765 yaml=a: 2 json=[2] eval=3 Helper')" ]

      - name: Bridge the bundled standard libraries
        working-directory: ironruby
        run: |
          dotnet build Src/Prism/IronRuby.Prism.csproj -p:IronRubyTargetFrameworks=$TFM
          EXE=""
          [ "$RUNNER_OS" = Windows ] && EXE=.exe
          SWEEP="Src/Prism/bin/Debug/$TFM/IronRuby.Prism$EXE"
          "$SWEEP" --sweep Src/StdLib/ruby/4.0 | tee sweep40.txt
          grep -q '0 failed' sweep40.txt
          "$SWEEP" --sweep Src/StdLib/ruby/gems | tee sweepgems.txt
          grep -q '0 failed' sweepgems.txt

      - name: IronRuby test suite
        working-directory: ironruby
        run: |
          dotnet build Src/IronRuby.Tests/IronRuby.Tests.csproj -p:IronRubyTargetFrameworks=$TFM
          EXE=""
          [ "$RUNNER_OS" = Windows ] && EXE=.exe
          cd "Src/IronRuby.Tests/bin/Debug/$TFM"
          "./IronRuby.Tests$EXE" > results.txt 2>&1 || true
          # A run that died - an access violation in native code ends the process - leaves no
          # "> FAILED" line to count; one that finished ends in PASSED or in its Repro line.
          if ! grep -qE 'PASSED.?$|^Repro: ' results.txt; then
            echo "::error::the test run did not finish"
            tail -n 40 results.txt
            exit 1
          fi
          failures=$(grep -c '^> FAILED' results.txt || true)
          echo "failure lines: $failures (baseline $BASELINE)"
          echo "::group::failing tests"
          # grep exits 1 when nothing matches, which under pipefail would fail a clean run
          { grep -oE '^> FAILED: .*' results.txt || true; } | sort | uniq -c | sort -rn
          echo "::endgroup::"
          if [ "$failures" -gt "$BASELINE" ]; then
            echo "::group::first failures in detail"
            sed -n '/^ *1)/,/^ *8)/p' results.txt
            echo "::endgroup::"
            exit 1
          fi

      # The full transcript, for looking at a failure that is inside the baseline.
      - name: Keep the test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ironruby-tests-${{ matrix.os }}-${{ matrix.tfm }}
          path: ironruby/Src/IronRuby.Tests/bin/Debug/${{ matrix.tfm }}/results.txt
          if-no-files-found: ignore

  ruby-spec:
    name: ruby/spec ${{ matrix.tfm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0, net10.0]
    env:
      TFM: ${{ matrix.tfm }}
      IR_TFM: ${{ matrix.tfm }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: ironruby
      - uses: actions/checkout@v7
        with:
          repository: IronLanguages/dlr
          ref: ${{ env.DLR_REF }}
          path: dlr
      - uses: actions/checkout@v7
        with:
          repository: ruby/prism
          ref: ${{ env.PRISM_REF }}
          path: prism
      - uses: actions/checkout@v7
        with:
          repository: ruby/spec
          ref: ${{ env.SPEC_REF }}
          path: ironruby/spec
      - uses: actions/checkout@v7
        with:
          repository: ruby/mspec
          ref: ${{ env.MSPEC_REF }}
          path: ironruby/mspec

      - name: Patch the DLR
        shell: bash
        run: |
          for patch in ironruby/Build/dlr-patches/*.patch; do
            echo "applying $patch"
            git -C dlr apply "../$patch"
          done

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-ubuntu-latest-${{ hashFiles('ironruby/**/*.csproj', 'ironruby/Directory.Build.props', 'dlr/**/*.csproj') }}
          restore-keys: nuget-ubuntu-latest-

      - name: Identify the prism checkout
        id: prism
        run: echo "sha=$(git -C prism rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the prism build
        id: prism-cache
        uses: actions/cache@v6
        with:
          path: prism/build
          key: prism-ubuntu-latest-${{ steps.prism.outputs.sha }}

      - name: Build libprism
        if: steps.prism-cache.outputs.cache-hit != 'true'
        working-directory: prism
        run: |
          ruby templates/template.rb
          make shared

      - name: Build
        working-directory: ironruby
        run: |
          ruby Src/Prism/generate.rb
          dotnet build Src/Console/Ruby.Console.csproj -p:IronRubyTargetFrameworks=$TFM

      - name: Run the ruby/spec language suite
        working-directory: ironruby
        run: |
          RUBY_EXE="$PWD/ir.sh" ./ir.sh -Imspec/lib mspec/bin/mspec-run spec/language \
            2>&1 | tee spec.txt || true
          tail -3 spec.txt
